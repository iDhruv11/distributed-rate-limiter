server:
  port: 8080

# Local dev defaults. Docker compose overrides these with environment variables.
spring:
  application:
    name: rate-limiter
  datasource:
    url: jdbc:postgresql://localhost:5432/ratelimiter
    username: ratelimiter
    password: ${POSTGRES_PASSWORD:ratelimiter}
  # Runs schema.sql on every startup (it only creates the table if it's missing).
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      # A rate limiter should answer fast or not at all; don't hang requests on a sick Redis.
      timeout: 300ms
      connect-timeout: 300ms

ratelimiter:
  # true: allow requests while Redis is down. false: deny them.
  fail-open: true

# After 3+ of the last 5 Redis calls fail, stop calling Redis for 5 seconds and answer straight from the fallback.
resilience4j:
  circuitbreaker:
    instances:
      redis:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2

springdoc:
  api-docs:
    path: /api-docs
